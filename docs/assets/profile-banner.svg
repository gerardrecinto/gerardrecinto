    <circle cx="345" cy="245" r="7" fill="#2dd4bf"/>
    <circle cx="530" cy="245" r="7" fill="#a78bfa"/>
    <circle cx="715" cy="245" r="7" fill="#f59e0b"/>
    <circle cx="900" cy="245" r="7" fill="#fb7185"/>
