    <text x="74" y="150" fill="#cbd5e1" font-size="24">Platform Engineering • CI/CD • GitOps • AI for DevOps</text>
    <text x="74" y="190" fill="#94a3b8" font-size="19">$26M/year cloud savings · 7h to 15m CI builds · 475+ Jenkins pipelines</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">
    <g transform="translate(110 225)">
      <rect width="125" height="52" rx="10" fill="#18243a" stroke="#38bdf8"/>
      <text x="31" y="33" fill="#e0f2fe">CI/CD</text>
    </g>
    <g transform="translate(295 225)">
      <rect width="125" height="52" rx="10" fill="#18243a" stroke="#2dd4bf"/>
      <text x="31" y="33" fill="#ccfbf1">GitOps</text>
    </g>
    <g transform="translate(480 225)">
      <rect width="125" height="52" rx="10" fill="#18243a" stroke="#a78bfa"/>
      <text x="34" y="33" fill="#ede9fe">Cloud</text>
    </g>
    <g transform="translate(665 225)">
      <rect width="125" height="52" rx="10" fill="#18243a" stroke="#f59e0b"/>
