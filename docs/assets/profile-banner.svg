<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Gerard Recinto platform engineering banner</title>
  <desc id="desc">A clean platform engineering banner showing CI, cloud, GitOps, AI, and product systems connected through an operating layer.</desc>
  <rect width="1280" height="420" fill="#0b1020"/>
  <path d="M0 315 C160 250 260 380 430 310 C620 235 760 265 930 200 C1090 140 1180 170 1280 110 L1280 420 L0 420 Z" fill="#13233f"/>
  <path d="M0 355 C180 290 310 405 500 340 C690 275 810 315 1010 245 C1160 192 1220 220 1280 185 L1280 420 L0 420 Z" fill="#0f3b4a"/>
  <g fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.6">
    <path d="M160 245 H345"/>
    <path d="M345 245 H530"/>
    <path d="M530 245 H715"/>
    <path d="M715 245 H900"/>
    <path d="M900 245 H1085"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
